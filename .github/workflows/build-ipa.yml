name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Microsoft VC++ Runtime DLLs
        run: |
          brew install sevenzip
          curl -LO https://aka.ms/vs/17/release/vc_redist.x64.exe
          
          mkdir -p /tmp/vcredist
          7zz x vc_redist.x64.exe -o/tmp/vcredist
          
          # Recursively extract any .cab files found inside the installer payload
          mkdir -p /tmp/vcredist_cab
          find /tmp/vcredist -name "*.cab" | while read -r cab; do
            echo "Extracting cabinet: $cab"
            7zz x "$cab" -o/tmp/vcredist_cab || true
          done
          
          # Gather all extracted DLLs and copy them to the target directory expected by Xcode
          mkdir -p app/Madeira/x86_64-vcruntime
          find /tmp/vcredist /tmp/vcredist_cab -name "*.dll" | while read -r dll; do
            cp "$dll" app/Madeira/x86_64-vcruntime/
          done
          
          echo "Successfully gathered the following DLLs:"
          ls -la app/Madeira/x86_64-vcruntime/

      - name: Set up Xcode & Dependencies
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          brew install bison flex mingw-w64 pkg-config meson ninja cmake

      - name: Run Native Build Scripts
        run: |
          for script in build/*/build.sh; do
            echo "Running $script..."
            bash "$script"
          done

      - name: Build Xcode Project / IPA
        run: |
          xcodebuild -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          mv build/DerivedData/Build/Products/Release-iphoneos/Madeira.app Payload/
          zip -r Madeira.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
