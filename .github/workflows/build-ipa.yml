name: Build Madeira IPA

on:
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build:
    runs-on: macos-14 # Uses a fast macOS Sonoma runner with Xcode pre-installed

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer # Adjust version if needed, or leave default
          xcodebuild -version

      - name: Run Build Scripts
        run: |
          # Madeira's build is split across Unix-side Wine, FEX, DXMT, etc.
          # Execute native build scripts located in build/*/build.sh or similar entry points
          bash build/ios/build.sh || echo "Check repository build scripts paths if this fails"

      - name: Build Xcode Project / IPA
        run: |
          # Build the iOS target using xcodebuild and output to an archive/payload folder
          # (Modify target/scheme names based on the exact Xcode project structure in /app or root)
          xcodebuild -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

          # Package into a Payload folder to create the .ipa
          mkdir -p Payload
          mv build/DerivedData/Build/Products/Release-iphoneos/Madeira.app Payload/
          zip -r Madeira.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
