name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Microsoft VC++ Runtime DLLs
        run: |
          brew install sevenzip
          curl -LO https://aka.ms/vs/17/release/vc_redist.x64.exe

          mkdir -p /tmp/vcredist
          7zz x vc_redist.x64.exe -o/tmp/vcredist

          mkdir -p /tmp/vcredist_cab
          find /tmp/vcredist -name "*.cab" | while read -r cab; do
            7zz x "$cab" -o/tmp/vcredist_cab || true
          done

          mkdir -p app/Madeira/x86_64-vcruntime
          find /tmp/vcredist /tmp/vcredist_cab -name "*.dll" | while read -r dll; do
            cp "$dll" app/Madeira/x86_64-vcruntime/
          done

      - name: Set up Toolchains & Dependencies
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          brew install bison flex mingw-w64 pkg-config meson ninja cmake wget

          mkdir -p toolchains
          cd toolchains
          curl -L https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz -o llvm-mingw.tar.xz
          tar -xf llvm-mingw.tar.xz
          cd ..

          # Don't touch PATH globally; just remember where things are
          echo "MINGW_BIN=$(pwd)/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin" >> $GITHUB_ENV
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH

      - name: Run Native Build Scripts
        run: |
          set -euo pipefail
          # llvm-mingw at the END so it can't shadow host clang/ld
          export PATH="$PATH:$MINGW_BIN"

          which clang bison flex || true
          bison --version | head -1

          for script in build/*/build.sh; do
            echo "Running $script..."
            bash -x "$script"
          done

      - name: Build Xcode Project / IPA
        run: |
          export PATH="$PATH:$MINGW_BIN"

          xcodebuild -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          mv build/DerivedData/Build/Products/Release-iphoneos/Madeira.app Payload/
          zip -r Madeira.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
