name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Microsoft VC++ Runtime DLLs
        run: |
          brew install sevenzip
          curl -LO https://aka.ms/vs/17/release/vc_redist.x64.exe
          mkdir -p /tmp/vcredist
          7zz x vc_redist.x64.exe -o/tmp/vcredist
          mkdir -p /tmp/vcredist_cab
          find /tmp/vcredist -name "*.cab" | while read -r cab; do
            7zz x "$cab" -o/tmp/vcredist_cab || true
          done
          mkdir -p app/Madeira/x86_64-vcruntime
          find /tmp/vcredist /tmp/vcredist_cab -name "*.dll" | while read -r dll; do
            cp "$dll" app/Madeira/x86_64-vcruntime/
          done

      - name: Set up Toolchains & Dependencies
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          brew install bison flex llvm pkg-config meson ninja cmake wget
          mkdir -p toolchains
          cd toolchains
          curl -L https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz -o llvm-mingw.tar.xz
          tar -xf llvm-mingw.tar.xz
          cd ..
          
          MINGW_PREFIX="$(pwd)/toolchains/llvm-mingw-20260421-ucrt-macos-universal"
          echo "MINGW_BIN=$MINGW_PREFIX/bin" >> $GITHUB_ENV
          echo "LLVM_PREFIX=$(brew --prefix llvm)" >> $GITHUB_ENV
          echo "$MINGW_PREFIX/bin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH

      - name: Install Wine (for host HLSL compiler)
        env:
          GH_TOKEN: ${{ github.token }}
          MVK_CONFIG_STRICT_MODE: 0
          MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS: 0
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          ASSETS="$(gh api 'repos/Gcenx/macOS_Wine_builds/releases?per_page=15' \
            --jq '.[].assets[].browser_download_url')"
          URL="$(echo "$ASSETS" | grep -E '/wine-stable-[0-9._]+-osx64\.tar\.xz$' | head -1)"
          [ -n "$URL" ] || URL="$(echo "$ASSETS" | grep -E '/wine-(devel|staging)-[0-9._]+(-wow64)?-osx64\.tar\.xz$' | head -1)"
          test -n "$URL"
          mkdir -p "$HOME/wine-dist"
          curl -L "$URL" -o /tmp/wine.tar.xz
          tar -xf /tmp/wine.tar.xz -C "$HOME/wine-dist"
          WINE_BIN="$(find "$HOME/wine-dist" -path '*Resources/wine/bin/wine' \( -type f -o -type l \) | head -1)"
          test -n "$WINE_BIN"
          sudo ln -sf "$WINE_BIN" /opt/homebrew/bin/wine
          export WINEDEBUG=-all WINEDLLOVERRIDES="mscoree,mshtml="
          export DISPLAY=""
          /opt/homebrew/bin/wine --version
          /opt/homebrew/bin/wine wineboot --init || true

      - name: Build Wine Host Tools
        run: |
          export PATH="$MINGW_BIN:$PATH"
          cd wine
          mkdir -p build-macos
          cd build-macos
          ../configure --enable-win64
          make -j$(sysctl -n hw.ncpu) tools/winebuild/winebuild
          cd ../..

      - name: Run Native Build Scripts
        env:
          WINEDEBUG: -all
          WINEDLLOVERRIDES: mscoree,mshtml=
          MVK_CONFIG_STRICT_MODE: 0
          MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS: 0
          DISPLAY: ""
          CC: x86_64-w64-mingw32-clang
          CXX: x86_64-w64-mingw32-clang++
        run: |
          set -euo pipefail
          export PATH="$PATH:$MINGW_BIN"
          for script in build/*/build.sh; do
            echo "Running $script..."
            bash -x "$script"
          done

      - name: Build Xcode Project / IPA
        run: |
          export PATH="$PATH:$MINGW_BIN"
          set -o pipefail
          xcodebuild -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | xcpretty || xcodebuild -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
            
          mkdir -p Payload
          mv build/DerivedData/Build/Products/Release-iphoneos/Madeira.app Payload/
          zip -r Madeira.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
